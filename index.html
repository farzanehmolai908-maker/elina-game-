<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ماجراجویی الینا</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<main id="gameWrap">

  <canvas id="game"></canvas>

  <!-- اطلاعات بازی -->
  <div id="hud">
    <div class="hudBox">❤️ <span id="lives">3</span></div>
    <div class="hudBox">🪙 <span id="coins">0</span></div>
    <div class="hudBox">💎 <span id="gems">0</span></div>
    <div class="hudBox">🔫 <span id="ammo">7</span></div>
    <div class="hudBox">🌍 <span id="stage">1-1</span></div>
  </div>

  <div id="message"></div>

  <!-- منوی اصلی -->
  <section id="menu" class="screen">

    <h1>🌟 ماجراجویی الینا 🌟</h1>

    <p>
      برای نجات پدر، ۴ دنیا و ۴۰ مرحله را پشت سر بگذار!
    </p>

    <button id="startBtn">
      شروع بازی
    </button>

    <button id="levelsBtn">
      🗺️ انتخاب مرحله
    </button>

    <button id="charsBtn">
      👧 شخصیت‌ها 💎
    </button>

  </section>

  <!-- نقشه مراحل -->
  <section id="levels" class="screen hidden">

    <h2>🗺️ نقشه مراحل</h2>

    <div id="worldTabs"></div>

    <div id="levelGrid"></div>

    <button class="backBtn">
      بازگشت
    </button>

  </section>

  <!-- شخصیت‌ها -->
  <section id="characters" class="screen hidden">

    <h2>👧 شخصیت‌ها</h2>

    <p>
      هر ۶۰ سکه = ۱ 💎 الماس
    </p>

    <div id="characterGrid"></div>

    <button class="backBtn">
      بازگشت
    </button>

  </section>

  <!-- پایان مرحله -->
  <section id="finish" class="screen hidden">

    <h2>🏆 مرحله کامل شد!</h2>

    <div class="stars">
      ★ ★ ★
    </div>

    <p id="finishStats"></p>

    <button id="nextBtn">
      مرحله بعد ➜
    </button>

    <button id="mapBtn">
      🗺️ نقشه مراحل
    </button>

  </section>

  <!-- مرحله گنج -->
  <section id="treasure" class="screen hidden">

    <h2>💰 مرحله گنج!</h2>

    <p>
      همه گنج‌ها را جمع کن!
    </p>

    <button id="treasureBtn">
      شروع مرحله گنج
    </button>

  </section>

  <!-- باخت -->
  <section id="gameover" class="screen hidden">

    <h2>🔥 بازی تمام شد!</h2>

    <p>
      نگران نباش؛ دوباره امتحان کن.
    </p>

    <button id="retryBtn">
      🔄 تلاش دوباره
    </button>

    <button id="gameMapBtn">
      🗺️ نقشه مراحل
    </button>

  </section>

  <!-- دکمه‌های داخل صفحه -->
  <div id="controls">

    <button id="left">
      ◀
    </button>

    <button id="right">
      ▶
    </button>

    <button id="shoot">
      🔫
    </button>

    <button id="jump">
      ▲
    </button>

  </div>

</main>

<script src="game.js"></script>

</body>
</html>
