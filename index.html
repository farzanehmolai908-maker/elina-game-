<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماجراجویی الینا 🎮</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-wrapper">

        <h1>🌟 ماجراجویی الینا</h1>

        <div class="info">
            <span>⭐ امتیاز: <b id="score">0</b></span>
            <span>🪙 سکه: <b id="coins">0</b></span>
            <span>❤️ جان: <b id="lives">3</b></span>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div class="message" id="message">
            برای شروع روی «شروع بازی» بزن!
        </div>

        <button id="startBtn">🎮 شروع بازی</button>

        <div class="controls">
            <button id="rightBtn">➡️</button>
            <button id="jumpBtn">⬆️ پرش</button>
            <button id="leftBtn">⬅️</button>
        </div>

        <p class="help">
            کامپیوتر: ← → برای حرکت | Space برای پرش
        </p>

    </div>

    <script src="game.js"></script>
</body>
</html>
