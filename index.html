<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>قازچ‌خور 🪿</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="game">

    <!-- صفحه شروع -->
    <div id="start-screen" class="screen">
      <h1>🪿 قازچ‌خور</h1>

      <p>
        آماده‌ای قازچ‌ها رو بخوری؟!
      </p>

      <button id="start-btn">
        شروع بازی 🎮
      </button>
    </div>


    <!-- صفحه بازی -->
    <div id="game-screen" class="screen hidden">

      <div class="top-bar">

        <div class="score-box">
          امتیاز:
          <span id="score">0</span>
        </div>

        <div class="time-box">
          زمان:
          <span id="time">60</span>
        </div>

      </div>


      <!-- زمین بازی -->
      <div id="game-area">

        <div id="player">
          🧑‍🌾
        </div>

      </div>

    </div>


    <!-- صفحه پایان -->
    <div id="game-over" class="screen hidden">

      <h2>🎉 بازی تمام شد!</h2>

      <p>
        امتیاز شما:
        <strong id="final-score">0</strong>
      </p>

      <button id="restart-btn">
        دوباره بازی کن 🔄
      </button>

    </div>

  </div>


  <script src="game.js"></script>

</body>
</html>
