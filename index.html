<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>قارچ خور</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="gameScreen">

    <canvas id="gameCanvas"></canvas>

    <!-- کنترل‌های بازی -->
    <div id="gameControls">

        <!-- سمت چپ -->
        <div class="leftControls">
            <button id="leftBtn" class="controlBtn">
                <span>◀</span>
            </button>

            <button id="rightBtn" class="controlBtn">
                <span>▶</span>
            </button>
        </div>

        <!-- سمت راست -->
        <div class="rightControls">

            <button id="shootBtn" class="controlBtn actionBtn">
                <span>●</span>
            </button>

            <button id="jumpBtn" class="controlBtn jumpBtn">
                <span>▲</span>
            </button>

        </div>

    </div>

    <!-- اطلاعات بازی -->
    <div id="hud">

        <div class="hudItem">
            ❤️ <span id="lives">3</span>
        </div>

        <div class="hudItem">
            🪙 <span id="coins">0</span>
        </div>

        <div class="hudItem">
            امتیاز: <span id="score">0</span>
        </div>

        <div class="hudItem">
            دنیا <span id="worldNumber">1</span>
            -
            مرحله <span id="levelNumber">1</span>
        </div>

    </div>

    <!-- پیام پایان مرحله -->
    <div id="levelComplete" class="overlay hidden">

        <div class="messageBox">

            <h1>🎉 مرحله تمام شد!</h1>

            <p id="completeText">
                آفرین!
            </p>

            <button id="nextLevelBtn">
                مرحله بعد
            </button>

        </div>

    </div>

</div>

<script src="game.js"></script>

</body>
</html>
